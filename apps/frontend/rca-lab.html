<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>rca-lab — Failure Scenarios</title>
  
  <!-- Inter font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          },
          colors: {
            appBg: '#f0f3f8',
            catBg: '#f2f5f9',
            borderLight: '#e4e8ee',
            textMain: '#1e293b',
            textMuted: '#64748b',
            textSub: '#8a99ad',
            severityHigh: '#e11d48',
            severityMedium: '#d97706',
            actionGreen: '#10b981',
            actionGreenHover: '#059669',
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f0f3f8;
      color: #1e293b;
      -webkit-font-smoothing: antialiased;
    }

    /* Table custom grid proportions matching reference image */
    .scenario-grid {
      display: grid;
      grid-template-columns: 1fr 140px 140px 120px;
      align-items: center;
    }

    @media (max-width: 768px) {
      .scenario-grid {
        grid-template-columns: 1fr 90px 90px 90px;
      }
    }

    /* Start button styling matching reference */
    .btn-start {
      background-color: #10b981;
      color: #ffffff;
      transition: all 0.15s ease-in-out;
    }
    .btn-start:hover {
      background-color: #059669;
    }
    .btn-start:active {
      transform: scale(0.97);
    }

    /* Stop button styling */
    .btn-stop {
      background-color: #334155;
      color: #ffffff;
      transition: all 0.15s ease-in-out;
    }
    .btn-stop:hover {
      background-color: #1e293b;
    }
    .btn-disabled {
      background-color: #cbd5e1;
      color: #475569;
      cursor: not-allowed;
    }

    /* Pulse animation for running state */
    .running-dot {
      box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
      animation: pulse 1.8s infinite cubic-bezier(0.66, 0, 0, 1);
    }
    @keyframes pulse {
      to {
        box-shadow: 0 0 0 6px rgba(16, 185, 129, 0);
      }
    }
  </style>
</head>
<body class="min-h-screen bg-[#f0f3f8] text-[#1e293b]">

  <!-- Top Navbar Header -->
  <header class="bg-white border-b border-[#e4e8ee] px-6 lg:px-12 py-3.5 flex items-center justify-between">
    <div class="flex items-center space-x-2">
      <span class="text-[17px] font-bold tracking-tight text-black">rca-lab</span>
      <span class="text-slate-400 font-normal text-sm select-none">—</span>
      <span class="text-[14px] text-[#64748b] font-normal">Failure Scenarios</span>
    </div>

    <div class="flex items-center space-x-4">
      <span class="text-xs text-[#8a99ad]">
        updated <span id="clock" class="text-[#64748b]">5:22:25 PM</span>
      </span>
      <button 
        onclick="resetAll()" 
        class="border border-[#f87171] hover:bg-[#fef2f2] text-[#ef4444] hover:text-[#dc2626] text-xs font-normal px-3 py-1 rounded transition-colors duration-150">
        Reset all
      </button>
    </div>
  </header>

  <!-- Main Content Layout -->
  <main class="max-w-[1400px] mx-auto px-6 lg:px-12 py-7">

    <div id="environment-banner" class="mb-5 rounded border border-slate-200 bg-white px-4 py-3 text-xs text-slate-600">
      Connecting to the local scenario controller...
    </div>
    
    <!-- Search Bar & Counter -->
    <div class="flex items-center space-x-4 mb-6">
      <div class="relative w-full max-w-[420px]">
        <input 
          id="search-input" 
          type="text" 
          oninput="onSearch(this.value)"
          placeholder="Search by name, category, or state..." 
          class="w-full bg-white border border-[#dce3ec] rounded px-3.5 py-1.5 text-[13px] placeholder-[#94a3b8] focus:outline-none focus:border-[#94a3b8] focus:ring-1 focus:ring-[#94a3b8] shadow-[0_1px_2px_rgba(0,0,0,0.03)]"
        />
        <button 
          id="clear-btn" 
          onclick="clearSearch()" 
          class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 text-xs">
          ✕
        </button>
      </div>

      <span id="scenario-counter" class="text-xs text-[#8a99ad] whitespace-nowrap">
        2 scenarios
      </span>
    </div>

    <!-- Scenarios Table Container -->
    <div class="bg-white rounded border border-[#e4e8ee] shadow-[0_1px_3px_rgba(0,0,0,0.02)] overflow-hidden">
      
      <!-- Table Header Row -->
      <div class="scenario-grid px-6 py-2.5 text-[11px] font-semibold text-[#8a99ad] tracking-wider uppercase border-b border-[#edf1f5]">
        <div>NAME</div>
        <div class="text-left">SEVERITY</div>
        <div class="text-left">STATE</div>
        <div class="text-right">ACTION</div>
      </div>

      <!-- Scenarios List Render Container -->
      <div id="scenarios-list">
        <!-- Rendered dynamically via JavaScript -->
      </div>

      <!-- Empty State -->
      <div id="no-results" class="hidden py-14 text-center">
        <p class="text-sm font-medium text-slate-600">No matching scenarios found</p>
        <p class="text-xs text-slate-400 mt-1">Try another keyword or clear the search query.</p>
        <button onclick="clearSearch()" class="mt-3 text-xs text-blue-600 hover:underline">Clear search</button>
      </div>

    </div>
  </main>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-6 right-6 transition-all duration-300 opacity-0 translate-y-3 pointer-events-none z-50">
    <div class="bg-slate-900 text-white text-xs px-4 py-2 rounded shadow-lg flex items-center space-x-2">
      <span id="toast-text">Reset complete</span>
    </div>
  </div>

  <script>
    // Only list scenarios implemented by the local API/worker stack.
    const scenarios = [
      {
        category: 'INFRASTRUCTURE',
        items: [
          {
            id: 'traffic-spike',
            title: 'Traffic spike',
            slug: 'traffic-spike',
            severity: 'Medium',
            maxJobs: 20,
            state: 'unavailable',
            supported: false
          }
        ]
      },
      {
        category: 'QUEUE',
        items: [
          {
            id: 'sqs-backlog-spike',
            title: 'SQS backlog spike',
            slug: 'sqs-backlog-spike',
            severity: 'High',
            maxJobs: 12,
            state: 'unavailable',
            supported: false
          }
        ]
      }
    ];

    let queryText = '';
    let activeRequestId = null;
    let scenarioStateInitialized = false;

    // Live Clock matching format 'updated 5:22:25 PM'
    function updateClock() {
      const now = new Date();
      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12 || 12;
      document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds} ${ampm}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Render table
    function render() {
      const container = document.getElementById('scenarios-list');
      const counter = document.getElementById('scenario-counter');
      const noResults = document.getElementById('no-results');

      let renderedHtml = '';
      let totalCount = 0;

      scenarios.forEach(group => {
        const matchingItems = group.items.filter(item => {
          if (!queryText) return true;
          const q = queryText.toLowerCase();
          return (
            item.title.toLowerCase().includes(q) ||
            item.slug.toLowerCase().includes(q) ||
            group.category.toLowerCase().includes(q) ||
            item.severity.toLowerCase().includes(q) ||
            item.state.toLowerCase().includes(q)
          );
        });

        if (matchingItems.length > 0) {
          totalCount += matchingItems.length;

          // Category banner
          renderedHtml += `
            <div class="bg-[#f2f5f9] px-6 py-2 border-y border-[#e8ecf2]">
              <span class="text-xs font-semibold text-[#475569] tracking-wider uppercase">
                ${group.category} ${matchingItems.length}
              </span>
            </div>
          `;

          // Scenario rows
          matchingItems.forEach(item => {
            const isRunning = item.state === 'running';

            // Severity color
            let severityColor = 'text-[#e11d48]'; // High - coral red
            if (item.severity === 'Medium') severityColor = 'text-[#d97706]'; // Medium - amber orange
            if (item.severity === 'Low') severityColor = 'text-[#64748b]';

            // State display
            let stateHtml = '';
            const sentJobs = item.run ? item.run.sentJobs : 0;
            const maxJobs = item.run ? item.run.maxJobs : item.maxJobs;
            const runProgress = `<span class="ml-3 text-[10px] text-[#8a99ad]">${sentJobs}/${maxJobs} jobs sent</span>`;
            if (isRunning) {
              stateHtml = `
                <div class="flex flex-col items-start">
                  <div class="flex items-center space-x-1.5 text-xs text-emerald-700 font-medium">
                    <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 running-dot"></span>
                    <span>Running</span>
                  </div>
                  ${runProgress}
                </div>
              `;
            } else {
              const labels = {
                idle: 'Idle',
                completed: 'Injection complete',
                stopped: 'Stopped',
                failed: 'Failed',
                unavailable: 'Unavailable'
              };
              const label = labels[item.state] || 'Unavailable';
              stateHtml = `
                <div class="flex flex-col items-start">
                  <div class="flex items-center space-x-1.5 text-xs ${item.state === 'failed' ? 'text-rose-700' : 'text-[#64748b]'}">
                    <span class="inline-block w-1.5 h-1.5 rounded-full bg-[#94a3b8]"></span>
                    <span>${label}</span>
                  </div>
                  ${runProgress}
                </div>
              `;
            }

            // Action button
            let actionHtml = '';
            if (!item.supported) {
              actionHtml = `
                <button disabled title="Not available in the local Compose stack"
                  class="btn-disabled inline-flex items-center justify-center text-xs font-medium px-3.5 py-1 rounded">
                  N/A
                </button>
              `;
            } else if (activeRequestId === item.id) {
              actionHtml = `
                <button disabled class="btn-disabled inline-flex items-center justify-center text-xs font-medium px-3.5 py-1 rounded">
                  Please wait
                </button>
              `;
            } else if (isRunning) {
              actionHtml = `
                <button
                  onclick="toggleScenario('${item.id}')"
                  class="btn-stop inline-flex items-center justify-center space-x-1 text-xs font-medium px-3.5 py-1 rounded">
                  <span class="text-[10px]">■</span>
                  <span>Stop</span>
                </button>
              `;
            } else {
              actionHtml = `
                <button
                  onclick="toggleScenario('${item.id}')"
                  class="btn-start inline-flex items-center justify-center space-x-1 text-xs font-medium px-3.5 py-1 rounded">
                  <span class="text-[10px]">▶</span>
                  <span>Start</span>
                </button>
              `;
            }

            renderedHtml += `
              <div class="scenario-grid px-6 py-3.5 border-b border-[#f1f4f8] hover:bg-[#fafbfd] transition-colors duration-100">
                <div class="pr-4">
                  <div class="text-[13.5px] font-medium text-[#1e293b] leading-tight">${item.title}</div>
                  <div class="text-[11.5px] text-[#8a99ad] font-normal mt-0.5">${item.slug}</div>
                </div>

                <div class="text-xs font-normal ${severityColor}">
                  ${item.severity}
                </div>

                <div>
                  ${stateHtml}
                </div>

                <div class="text-right">
                  ${actionHtml}
                </div>
              </div>
            `;
          });
        }
      });

      counter.textContent = `${totalCount} scenarios`;

      if (totalCount === 0) {
        container.innerHTML = '';
        noResults.classList.remove('hidden');
      } else {
        container.innerHTML = renderedHtml;
        noResults.classList.add('hidden');
      }
    }

    function findScenario(id) {
      for (const group of scenarios) {
        const item = group.items.find(scenario => scenario.id === id);
        if (item) return item;
      }
      return null;
    }

    async function requestScenario(id, action) {
      const response = await fetch(`/api/chaos/scenarios/${encodeURIComponent(id)}/${action}`, {
        method: 'POST'
      });
      const data = await response.json();
      if (!response.ok) {
        throw new Error(data.message || `Scenario request failed (${response.status})`);
      }
      return data;
    }

    async function toggleScenario(id) {
      const item = findScenario(id);
      if (!item || !item.supported || activeRequestId) return;

      const action = item.state === 'running' ? 'stop' : 'start';
      if (action === 'start') {
        const limits = id === 'traffic-spike'
          ? 'This sends at most 20 jobs to the local queue over about 10 seconds.'
          : 'This sends at most 12 jobs to the local queue over about 6 seconds.';
        if (!window.confirm(`${limits} A batch already being submitted may finish, and jobs accepted by SQS may continue after Stop. Continue?`)) {
          return;
        }
      }

      activeRequestId = id;
      render();
      try {
        const result = await requestScenario(id, action);
        await loadScenarioStates();
        const run = result.scenario;
        showToast(action === 'start'
          ? `Started ${item.title}: ${run.sentJobs}/${run.maxJobs} jobs queued`
          : `Stopped sending jobs for ${item.title}`);
      } catch (error) {
        showToast(error.message);
        await loadScenarioStates();
      } finally {
        activeRequestId = null;
        render();
      }
    }

    async function loadScenarioStates() {
      try {
        const response = await fetch('/api/chaos/scenarios');
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || `Controller unavailable (${response.status})`);

        let changed = !scenarioStateInitialized;
        const apiScenarios = new Map(data.scenarios.map(scenario => [scenario.id, scenario]));
        scenarios.forEach(group => group.items.forEach(item => {
          const current = apiScenarios.get(item.id);
          const supported = Boolean(data.enabled && current && current.supported);
          const state = supported ? current.status : 'unavailable';
          const run = supported ? current.run : null;
          if (item.supported !== supported ||
            item.state !== state ||
            (item.run && run && (
              item.run.sentJobs !== run.sentJobs ||
              item.run.maxJobs !== run.maxJobs
            )) ||
            Boolean(item.run) !== Boolean(run)) changed = true;
          item.supported = supported;
          item.state = state;
          item.run = run;
        }));

        const banner = document.getElementById('environment-banner');
        const bannerText = data.enabled
          ? 'Local-only: Start submits a bounded number of jobs. Stop prevents future batches; pending and accepted jobs may still be processed.'
          : `Chaos controls are disabled: ${data.reason}`;
        const bannerClass = `mb-5 rounded border px-4 py-3 text-xs ${data.enabled
          ? 'border-emerald-200 bg-emerald-50 text-emerald-800'
          : 'border-amber-200 bg-amber-50 text-amber-800'}`;
        if (banner.textContent !== bannerText || banner.className !== bannerClass) changed = true;
        banner.textContent = bannerText;
        banner.className = bannerClass;
        scenarioStateInitialized = true;
        if (changed) render();
      } catch (error) {
        const banner = document.getElementById('environment-banner');
        const bannerText = `Cannot connect to the local scenario controller: ${error.message}`;
        const bannerClass = 'mb-5 rounded border border-rose-200 bg-rose-50 px-4 py-3 text-xs text-rose-800';
        let changed = !scenarioStateInitialized ||
          banner.textContent !== bannerText ||
          banner.className !== bannerClass;
        banner.textContent = bannerText;
        banner.className = bannerClass;
        scenarios.forEach(group => group.items.forEach(item => {
          if (item.supported || item.state !== 'unavailable') changed = true;
          item.supported = false;
          item.state = 'unavailable';
        }));
        scenarioStateInitialized = true;
        if (changed) render();
      }
    }

    async function resetAll() {
      const active = scenarios.flatMap(group => group.items)
        .filter(item => item.supported && item.state === 'running');
      if (active.length === 0) {
        showToast('No active scenarios to stop');
        return;
      }
      if (!window.confirm('Stop all active scenarios? A pending batch and jobs already accepted by SQS may still be processed.')) {
        return;
      }

      try {
        for (const item of active) await requestScenario(item.id, 'stop');
        await loadScenarioStates();
        showToast('Stopped future batches; pending/queued jobs may continue');
      } catch (error) {
        showToast(error.message);
        await loadScenarioStates();
      }
    }

    // Search query listener
    function onSearch(val) {
      queryText = val.trim();
      const clearBtn = document.getElementById('clear-btn');
      if (queryText) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }
      render();
    }

    function clearSearch() {
      const input = document.getElementById('search-input');
      input.value = '';
      queryText = '';
      document.getElementById('clear-btn').classList.add('hidden');
      render();
    }

    // Show toast message
    function showToast(msg) {
      const toast = document.getElementById('toast');
      const text = document.getElementById('toast-text');
      text.textContent = msg;

      toast.classList.remove('opacity-0', 'translate-y-3');
      toast.classList.add('opacity-100', 'translate-y-0');

      setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'translate-y-3');
      }, 2000);
    }

    document.addEventListener('DOMContentLoaded', () => {
      render();
      loadScenarioStates();
      setInterval(loadScenarioStates, 2000);
    });
  </script>
</body>
</html>
