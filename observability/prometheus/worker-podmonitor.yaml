apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: worker-service
  namespace: observability
  labels:
    app.kubernetes.io/name: worker-service
spec:
  namespaceSelector:
    matchNames:
      - app
  selector:
    matchLabels:
      app: worker-service
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
