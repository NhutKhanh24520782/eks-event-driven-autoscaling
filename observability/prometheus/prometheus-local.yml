global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: 'worker-service'
    static_configs:
      - targets: ['worker-service:8081']
        labels:
          app: 'worker-service'
          env: 'local'

  - job_name: 'api-service'
    static_configs:
      - targets: ['api-service:8080']
        labels:
          app: 'api-service'
          env: 'local'

