services:
  # ElasticMQ emulates AWS SQS locally: 100% free, no license token, instant startup
  sqs:
    image: softwaremill/elasticmq-native:latest
    container_name: sqs-mock
    ports:
      - "9324:9324"
    volumes:
      - ./scripts/local/elasticmq.conf:/opt/docker/conf/elasticmq.conf:ro

  # API Service (Phat - Backend)
  # Host port mapped to 3000 (Windows reserves 8000-8100)
  api-service:
    build:
      context: ./apps/api-service
      dockerfile: Dockerfile
    container_name: api-service
    ports:
      - "3000:8080"
    environment:
      - PORT=8080
      - AWS_REGION=ap-southeast-1
      - AWS_ACCESS_KEY_ID=dummy
      - AWS_SECRET_ACCESS_KEY=dummy
      - AWS_ENDPOINT_URL=http://sqs:9324
      - QUEUE_URL=http://sqs:9324/000000000000/jobs-queue
    depends_on:
      - sqs

  # Worker Service (Phat - Backend)
  # Host port mapped to 3001 (Windows reserves 8000-8100)
  worker-service:
    build:
      context: ./apps/worker-service
      dockerfile: Dockerfile
    container_name: worker-service
    ports:
      - "3001:8081"
    environment:
      - AWS_REGION=ap-southeast-1
      - AWS_ACCESS_KEY_ID=dummy
      - AWS_SECRET_ACCESS_KEY=dummy
      - AWS_ENDPOINT_URL=http://sqs:9324
      - QUEUE_URL=http://sqs:9324/000000000000/jobs-queue
      - HEALTH_PORT=8081
      - WAIT_TIME_SECONDS=5
      - WORKER_PROCESS_TIME_MS=1000
    depends_on:
      - sqs

  # Prometheus for scraping metrics locally (every 2s)
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: prometheus-local
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus-local.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - worker-service

  # Grafana for visualizing Worker & SQS metrics
  grafana:
    image: grafana/grafana:10.2.0
    container_name: grafana-local
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
